spring.application.name=mcp-knowledge-base

# MCP Server - Streamable HTTP transport
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

# Server config
server.port=8000

# Fix Tomcat SO_LINGER SocketException on long-lived MCP connections
server.tomcat.socket.so-linger-timeout=-1
